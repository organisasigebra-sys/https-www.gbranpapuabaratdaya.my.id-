<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Jadwal Kegiatan Keorganisasian</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background: white;
                padding: 0;
            }
            .print-container {
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
            }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 p-4 sm:p-6 lg:p-8">

    <div class="max-w-7xl mx-auto bg-white rounded-2xl shadow-sm border border-gray-200 p-6 sm:p-8 print-container">
        
        <!-- Header Aplikasi -->
        <div class="border-b border-gray-200 pb-5 mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
                <span class="inline-block px-3 py-1 bg-red-100 text-red-800 text-xs font-bold rounded-full mb-2">
                    Manajemen Agenda
                </span>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-900 tracking-tight">Jadwal Kegiatan Organisasi</h1>
                <p class="text-sm text-gray-500 mt-1">Kelola, catat, dan pantau seluruh agenda keorganisasian secara fleksibel.</p>
            </div>
            <div class="flex items-center gap-2 self-start sm:self-auto no-print">
                <button onclick="window.print()" class="flex items-center gap-2 bg-gray-900 hover:bg-gray-800 text-white text-xs font-bold py-2.5 px-4 rounded-xl transition shadow-sm">
                    <i class="fas fa-print"></i>
                    <span>Cetak / PDF</span>
                </button>
            </div>
        </div>

        <!-- Formulir Input Data (Tersembunyi Saat Dicetak) -->
        <div class="bg-gray-50 p-5 rounded-xl border border-gray-200 mb-8 no-print">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider flex items-center gap-2" id="formTitle">
                    <i class="fas fa-plus-circle text-red-700"></i> Tambah Agenda Baru
                </h2>
                <span class="text-xs text-gray-400">*Wajib diisi</span>
            </div>
            
            <form id="scheduleForm" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <input type="hidden" id="editIndex" value="-1">
                
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Waktu / Tanggal *</label>
                    <input type="text" id="waktu" placeholder="Contoh: 15 Okt 2026 / 09.00 WIB" class="w-full text-xs p-2.5 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-700 focus:border-transparent transition" required>
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Nama Kegiatan *</label>
                    <input type="text" id="nama" placeholder="Contoh: Rapat Pleno Pengurus" class="w-full text-xs p-2.5 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-700 focus:border-transparent transition" required>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Penanggung Jawab (PJ) *</label>
                    <input type="text" id="pj" placeholder="Contoh: Budi (Sekretaris)" class="w-full text-xs p-2.5 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-700 focus:border-transparent transition" required>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Tempat / Lokasi *</label>
                    <input type="text" id="lokasi" placeholder="Contoh: Aula Utama / Zoom" class="w-full text-xs p-2.5 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-700 focus:border-transparent transition" required>
                </div>

                <div class="sm:col-span-2 lg:col-span-2">
                    <label class="block text-xs font-bold text-gray-700 mb-1">Deskripsi / Tujuan</label>
                    <input type="text" id="deskripsi" placeholder="Penjelasan singkat tujuan atau agenda acara" class="w-full text-xs p-2.5 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-700 focus:border-transparent transition">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Anggaran (Rp)</label>
                    <input type="text" id="anggaran" placeholder="Contoh: 1.500.000" class="w-full text-xs p-2.5 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-700 focus:border-transparent transition">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Status Kegiatan</label>
                    <select id="status" class="w-full text-xs p-2.5 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-700 focus:border-transparent transition">
                        <option value="Rencana">Rencana</option>
                        <option value="Berjalan">Berjalan</option>
                        <option value="Selesai">Selesai</option>
                        <option value="Dibatalkan">Dibatalkan</option>
                    </select>
                </div>

                <div class="sm:col-span-2 lg:col-span-4 flex justify-end gap-2 mt-2">
                    <button type="button" onclick="resetForm()" id="cancelBtn" class="hidden bg-gray-200 hover:bg-gray-300 text-gray-700 text-xs font-bold py-2.5 px-4 rounded-lg transition">
                        Batal
                    </button>
                    <button type="submit" id="submitBtn" class="bg-red-800 hover:bg-red-900 text-white text-xs font-bold py-2.5 px-5 rounded-lg transition shadow-sm flex items-center gap-2">
                        <i class="fas fa-plus"></i>
                        <span>Simpan Kegiatan</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- Tabel Kegiatan -->
        <div class="overflow-x-auto rounded-xl border border-gray-200">
            <table class="w-full border-collapse text-left text-xs sm:text-sm">
                <thead>
                    <tr class="bg-gray-50 border-b border-gray-200 text-xs font-bold uppercase tracking-wider text-gray-600">
                        <th class="p-3.5 border-r border-gray-200 text-center w-12">No</th>
                        <th class="p-3.5 border-r border-gray-200">Waktu / Tanggal</th>
                        <th class="p-3.5 border-r border-gray-200">Nama Kegiatan</th>
                        <th class="p-3.5 border-r border-gray-200">Deskripsi / Tujuan</th>
                        <th class="p-3.5 border-r border-gray-200">PJ</th>
                        <th class="p-3.5 border-r border-gray-200">Lokasi</th>
                        <th class="p-3.5 border-r border-gray-200">Anggaran</th>
                        <th class="p-3.5 border-r border-gray-200 text-center">Status</th>
                        <th class="p-3.5 text-center no-print">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="divide-y divide-gray-200 text-gray-700">
                    <!-- Data di-render otomatis via JS -->
                </tbody>
            </table>
        </div>

        <!-- Footer Hasil Cetak -->
        <div class="mt-8 pt-4 border-t border-gray-100 hidden print:flex justify-between text-xs text-gray-500">
            <div>Dokumen Resmi Agenda Organisasi</div>
            <div>Dicetak secara otomatis</div>
        </div>

    </div>

    <!-- Script Logika Aplikasi -->
    <script>
        // Mengambil data dari localStorage saat awal dimuat
        let activities = JSON.parse(localStorage.getItem('orgAppSchedules')) || [];

        const form = document.getElementById('scheduleForm');
        const tableBody = document.getElementById('tableBody');
        const editIndexInput = document.getElementById('editIndex');
        const submitBtn = document.getElementById('submitBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const formTitle = document.getElementById('formTitle');

        function saveToStorage() {
            localStorage.setItem('orgAppSchedules', JSON.stringify(activities));
        }

        function renderTable() {
            tableBody.innerHTML = '';

            if (activities.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="9" class="p-8 text-center text-gray-400 italic bg-gray-50/50">
                            <i class="fas fa-calendar-times text-2xl mb-2 text-gray-300 block"></i>
                            Belum ada jadwal kegiatan tersimpan. Silakan isi formulir di atas.
                        </td>
                    </tr>
                `;
                return;
            }

            activities.forEach((act, index) => {
                let statusBadge = '';
                switch (act.status) {
                    case 'Rencana': 
                        statusBadge = 'bg-blue-50 text-blue-700 border-blue-200'; 
                        break;
                    case 'Berjalan': 
                        statusBadge = 'bg-amber-50 text-amber-700 border-amber-200'; 
                        break;
                    case 'Selesai': 
                        statusBadge = 'bg-emerald-50 text-emerald-700 border-emerald-200'; 
                        break;
                    case 'Dibatalkan': 
                        statusBadge = 'bg-rose-50 text-rose-700 border-rose-200'; 
                        break;
                }

                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50 transition-colors';
                row.innerHTML = `
                    <td class="p-3.5 border-r border-gray-200 text-center font-bold text-gray-500">${index + 1}</td>
                    <td class="p-3.5 border-r border-gray-200 font-medium">${act.waktu}</td>
                    <td class="p-3.5 border-r border-gray-200 font-semibold text-gray-900">${act.nama}</td>
                    <td class="p-3.5 border-r border-gray-200 text-xs text-gray-500">${act.deskripsi || '-'}</td>
                    <td class="p-3.5 border-r border-gray-200">${act.pj}</td>
                    <td class="p-3.5 border-r border-gray-200">${act.lokasi}</td>
                    <td class="p-3.5 border-r border-gray-200">${act.anggaran ? 'Rp ' + act.anggaran : '-'}</td>
                    <td class="p-3.5 border-r border-gray-200 text-center">
                        <span class="px-2.5 py-1 rounded-full text-xs font-semibold border ${statusBadge}">
                            ${act.status}
                        </span>
                    </td>
                    <td class="p-3.5 text-center no-print whitespace-nowrap">
                        <button onclick="editActivity(${index})" class="text-blue-600 hover:text-blue-800 p-1.5 transition" title="Edit">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button onclick="deleteActivity(${index})" class="text-red-600 hover:text-red-800 p-1.5 transition" title="Hapus">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const newActivity = {
                waktu: document.getElementById('waktu').value,
                nama: document.getElementById('nama').value,
                pj: document.getElementById('pj').value,
                lokasi: document.getElementById('lokasi').value,
                deskripsi: document.getElementById('deskripsi').value,
                anggaran: document.getElementById('anggaran').value,
                status: document.getElementById('status').value
            };

            const index = editIndexInput.value;
            if (index === "-1") {
                activities.push(newActivity);
            } else {
                activities[index] = newActivity;
            }

            saveToStorage();
            renderTable();
            resetForm();
        });

        function editActivity(index) {
            const act = activities[index];
            document.getElementById('waktu').value = act.waktu;
            document.getElementById('nama').value = act.nama;
            document.getElementById('pj').value = act.pj;
            document.getElementById('lokasi').value = act.lokasi;
            document.getElementById('deskripsi').value = act.deskripsi;
            document.getElementById('anggaran').value = act.anggaran;
            document.getElementById('status').value = act.status;

            editIndexInput.value = index;
            formTitle.innerHTML = '<i class="fas fa-edit text-blue-600"></i> Edit Agenda Kegiatan';
            submitBtn.innerHTML = '<i class="fas fa-save"></i><span>Update Kegiatan</span>';
            submitBtn.className = "bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2.5 px-5 rounded-lg transition shadow-sm flex items-center gap-2";
            cancelBtn.classList.remove('hidden');
        }

        function deleteActivity(index) {
            if (confirm('Apakah Anda yakin ingin menghapus agenda kegiatan ini?')) {
                activities.splice(index, 1);
                saveToStorage();
                renderTable();
            }
        }

        function resetForm() {
            form.reset();
            editIndexInput.value = "-1";
            formTitle.innerHTML = '<i class="fas fa-plus-circle text-red-700"></i> Tambah Agenda Baru';
            submitBtn.innerHTML = '<i class="fas fa-plus"></i><span>Simpan Kegiatan</span>';
            submitBtn.className = "bg-red-800 hover:bg-red-900 text-white text-xs font-bold py-2.5 px-5 rounded-lg transition shadow-sm flex items-center gap-2";
            cancelBtn.classList.add('hidden');
        }

        // Render data saat halaman pertama kali dibuka
        renderTable();
    </script>
</body>
</html>
